<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Convertite en Leyenda</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .admin-wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 100px; }
  .admin-card { background: var(--panel-dark); border: 1px solid #2A232A; border-radius: 4px; padding: 20px; margin-bottom: 20px; }
  .admin-card h3 { font-family: var(--font-display); font-weight:400; color: var(--gold); margin-top:0; }
  label { display:block; font-size:12px; color: var(--parchment-dim); margin: 10px 0 4px; }
  input, textarea, select { width:100%; background:#0C0A0D; border:1px solid #332B33; color:var(--parchment); padding:8px; border-radius:2px; font-family: var(--font-body); }
  textarea { min-height: 90px; font-family: monospace; font-size: 12.5px; }
  button { margin-top: 12px; background: var(--crimson); color: var(--ink-black); border:none; padding:9px 16px; cursor:pointer; border-radius:2px; font-weight:600; }
  button.secondary { background: transparent; border:1px solid var(--parchment-dim); color: var(--parchment-dim); }
  .admin-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #241E24; font-size:13px; }
  .admin-row .tag { color: var(--gold); font-size:11px; margin-left:auto; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .checkbox-row input { width:auto; }
  #login-error { color: var(--crimson); font-size:13px; }
</style>
</head>
<body>

<div id="login-view" class="admin-wrap">
  <div class="admin-card">
    <h3>Acceso administrador</h3>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Contraseña</label>
      <input type="password" id="password" required>
      <button type="submit">Ingresar</button>
      <p id="login-error"></p>
    </form>
  </div>
</div>

<div id="admin-view" class="admin-wrap" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-family:var(--font-display); color:var(--gold);">PANEL DE CONTENIDO</h2>
    <button class="secondary" id="logout-btn">Cerrar sesión</button>
  </div>

  <div class="admin-card">
    <h3>Historias</h3>
    <label>Historia activa</label>
    <select id="story-select"></select>

    <details style="margin-top:14px;">
      <summary style="cursor:pointer; color:var(--parchment-dim); font-size:13px;">+ Crear nueva historia</summary>
      <form id="new-story-form">
        <label>Título</label>
        <input type="text" id="story-title" required>
        <label>Clasificación de edad</label>
        <select id="story-age-rating">
          <option value="13+">13+</option>
          <option value="16+">16+</option>
          <option value="18+">18+</option>
        </select>
        <label>Stats de la historia (separados por coma, ej: carisma, honor, poder)</label>
        <input type="text" id="story-stat-keys" placeholder="carisma, honor, poder">
        <button type="submit">Crear historia</button>
      </form>
    </details>
  </div>

  <div class="admin-card">
    <h3>Capítulos</h3>
    <div id="chapter-list"></div>

    <hr style="border-color:#241E24; margin:16px 0;">
    <form id="chapter-form">
      <input type="hidden" id="chapter-id">
      <label>Orden (número)</label>
      <input type="number" id="chapter-order" required>
      <label>Título</label>
      <input type="text" id="chapter-title" required>
      <label>Texto de la escena</label>
      <textarea id="chapter-text" required></textarea>
      <label>URL de imagen (Cloudinary)</label>
      <input type="text" id="chapter-image">
      <label>Advertencias de contenido (separadas por coma)</label>
      <input type="text" id="chapter-warnings" placeholder="violencia, temática adulta">
      <div class="checkbox-row">
        <input type="checkbox" id="chapter-is-ending">
        <label style="margin:0;">Este capítulo es un final</label>
      </div>
      <label>Decisiones (JSON — ver formato en README)</label>
      <textarea id="chapter-choices" placeholder='[{"id":"a","text":"...","nextChapterId":"cap-2","effects":{"honor":1}}]'></textarea>
      <button type="submit">Guardar capítulo</button>
      <button type="button" id="chapter-form-reset" class="secondary">Nuevo / limpiar</button>
    </form>
  </div>

  <div class="admin-card">
    <h3>Finales</h3>
    <form id="ending-form">
      <label>ID corto (ej: final-heroe)</label>
      <input type="text" id="ending-id" required>
      <label>Título</label>
      <input type="text" id="ending-title" required>
      <label>Descripción</label>
      <textarea id="ending-description" required></textarea>
      <label>URL de imagen</label>
      <input type="text" id="ending-image">
      <label>Condición de stats (JSON, opcional — ej: {"honor":{"min":5}})</label>
      <textarea id="ending-condition">{}</textarea>
      <label>Prioridad (mayor = se evalúa primero si hay varios finales posibles)</label>
      <input type="number" id="ending-priority" value="0">
      <button type="submit">Guardar final</button>
    </form>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
