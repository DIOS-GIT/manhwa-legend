<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Capítulos — Convertite en Leyenda</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-wrap">
  <div class="admin-topbar">
    <h2>CAPÍTULOS Y DECISIONES</h2>
    <button class="secondary" id="logout-btn">Cerrar sesión</button>
  </div>

  <nav id="admin-nav" class="admin-nav"></nav>

  <div class="active-story-bar">
    <span>Historia activa:</span>
    <select id="story-select"></select>
  </div>

  <div class="admin-card">
    <h3>Lista de capítulos</h3>
    <p class="helper-text">
      El primer capítulo de cada ruta NO se marca acá — se define por Protagonista + Ruta
      (sección Protagonistas). Los capítulos siguientes se encadenan con <code>nextChapterId</code>
      dentro de cada decisión.
    </p>
    <div id="chapter-list"></div>
  </div>

  <div class="admin-card">
    <h3 id="chapter-form-title">Nuevo capítulo</h3>
    <form id="chapter-form">
      <input type="hidden" id="chapter-id">
      <label>Orden (número)</label>
      <input type="number" id="chapter-order" required>
      <label>Título</label>
      <input type="text" id="chapter-title" required>
      <label>Texto de la escena</label>
      <textarea id="chapter-text" required></textarea>

      <label>Imagen</label>
      <div class="image-field-row">
        <input type="text" id="chapter-image" placeholder="https://... o subí una">
        <button type="button" id="chapter-upload-btn" class="upload-btn">Subir imagen</button>
      </div>
      <img class="image-preview" data-preview-for="chapter-image">

      <label>Advertencias de contenido (separadas por coma)</label>
      <input type="text" id="chapter-warnings" placeholder="violencia, temática adulta">
      <div class="checkbox-row">
        <input type="checkbox" id="chapter-is-ending">
        <label style="margin:0;">Este capítulo es un final</label>
      </div>
      <label>ID de final a mostrar si "es un final" está marcado</label>
      <input type="text" id="chapter-ending-id" placeholder="final-heroe">

      <label>Decisiones (JSON). Cada decisión acepta <code>effects</code> (suma stats — incluida la
        clave de afecto de una waifu), <code>setFlags</code>, y <code>requires</code> con
        <code>{"min","max"}</code> o <code>{"equals": valor}</code>.</label>
      <textarea id="chapter-choices" placeholder='[{"id":"a","text":"...","nextChapterId":"cap-2","effects":{"honor":1,"afecto_yuna":2},"setFlags":{"job":"detective"}}]'></textarea>
      <button type="submit">Guardar capítulo</button>
      <button type="button" id="chapter-form-reset" class="secondary">Nuevo / limpiar</button>
    </form>
  </div>
</div>

<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script type="module" src="js/admin-chapters.js"></script>
</body>
</html>
