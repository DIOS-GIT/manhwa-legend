<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Finales — Convertite en Leyenda</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-wrap">
  <div class="admin-topbar">
    <h2>FINALES</h2>
    <button class="secondary" id="logout-btn">Cerrar sesión</button>
  </div>

  <nav id="admin-nav" class="admin-nav"></nav>

  <div class="active-story-bar">
    <span>Historia activa:</span>
    <select id="story-select"></select>
  </div>

  <div class="admin-card">
    <h3>Lista de finales</h3>
    <div id="ending-list"></div>
  </div>

  <div class="admin-card">
    <h3 id="ending-form-title">Nuevo final</h3>
    <form id="ending-form">
      <label>ID corto (ej: final-heroe) — no se puede cambiar después de creado</label>
      <input type="text" id="ending-id" required>
      <label>Título</label>
      <input type="text" id="ending-title" required>
      <label>Descripción</label>
      <textarea id="ending-description" required></textarea>

      <label>Imagen</label>
      <div class="image-field-row">
        <input type="text" id="ending-image" placeholder="https://... o subí una">
        <button type="button" id="ending-upload-btn" class="upload-btn">Subir imagen</button>
      </div>
      <img class="image-preview" data-preview-for="ending-image">

      <label>Condición de stats (JSON, opcional — ej: {"honor":{"min":5}})</label>
      <textarea id="ending-condition">{}</textarea>
      <label>Prioridad (mayor = se evalúa primero si hay varios finales posibles)</label>
      <input type="number" id="ending-priority" value="0">
      <button type="submit">Guardar final</button>
      <button type="button" id="ending-form-reset" class="secondary">Nuevo / limpiar</button>
    </form>
  </div>
</div>

<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<script type="module" src="js/admin-endings.js"></script>
</body>
</html>
